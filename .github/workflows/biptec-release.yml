name: BIPTEC FreeIPA build and release

on:
  push:
    branches:
      - 'biptec/**'
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biptec-freeipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install build bootstrap tools
        run: |
          dnf -y install git rpm-build rpmdevtools dnf-plugins-core fedpkg \
            createrepo_c python3 findutils tar gzip xz patch diffutils which gh
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust checked-out repository in Fedora container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch pinned upstream release tag
        shell: bash
        run: |
          source BIPTEC-RELEASE
          git fetch --no-tags https://github.com/freeipa/freeipa.git \
            "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"

      - name: Verify downstream source
        run: biptec/release/verify-source.sh

      - name: Build Fedora RPMs and repository bundle
        run: biptec/release/build-fedora-rpms.sh "$GITHUB_WORKSPACE/dist/biptec-release"

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: biptec-freeipa-${{ github.run_number }}
          path: dist/biptec-release/
          if-no-files-found: error
          retention-days: 30

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source BIPTEC-RELEASE
          expected="${PACKAGE_VERSION}-${BIPTEC_RELEASE}"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Expected release tag $expected, got $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/biptec-release/*-repo.tar.gz \
            dist/biptec-release/*-patches.tar.gz \
            dist/biptec-release/srpm/*.src.rpm \
            dist/biptec-release/SHA256SUMS \
            dist/biptec-release/BUILD-METADATA.txt \
            dist/biptec-release/RPM-MANIFEST.txt \
            dist/biptec-release/README-INSTALL.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
